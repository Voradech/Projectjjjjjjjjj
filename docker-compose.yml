services:
  frontend:
    # Frontend service
    build:
      context: ./frontend
      dockerfile: dockerfile
    container_name: frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/app:/app/frontend/app
      - /app/frontend/node_modules
    networks:
      - pgsite
 
  backend:
    # Backend service
    build:
      context: ./backend
      dockerfile: dockerfile
    container_name: backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=admin
      - DB_PASS=root
      - DB_NAME=predicton_db
      - DB_SSL=false
      - CORS_ORIGIN=http://localhost:3000
      - PREDICTION_API_URL=http://prediction_model:8001
    volumes:
      - ./backend/src:/app/src
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
      prediction_model:
        condition: service_started
    networks:
      - pgsite

  prediction_model:
    # Prediction model service
    build:
      context: ./prediction_model
      dockerfile: Dockerfile
    container_name: prediction_model
    ports:
      - "8001:8001"
    volumes:
      - ./prediction_model:/app
    networks:
      - pgsite
  db:
    # PostgreSQL database service
    image: postgres:16
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    restart: always
    ports:
      - '5435:5432'
    environment:
      - PGDATA=/var/lib/postgresql/data/pgdata
      - POSTGRES_DB=predicton_db
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=root
    networks:
      - pgsite
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d predicton_db"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  db_data: 

networks:
  pgsite:
